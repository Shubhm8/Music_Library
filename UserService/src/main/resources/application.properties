spring.application.name=UserService

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/user_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
premium.monthly-price-paise=${PREMIUM_MONTHLY_PRICE_PAISE:9900}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
internal.api-key=${INTERNAL_API_KEY}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://notification-service:8085}

spring.application.name=UserService

server.port=${PORT:8080}

spring.datasource.url=${USER_DATASOURCE_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/Music_Library}}
spring.datasource.username=${USER_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${USER_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
jwt.secret=${JWT_SECRET}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
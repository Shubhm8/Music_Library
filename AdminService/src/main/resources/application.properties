spring.application.name=AdminService
server.port=8082

spring.datasource.url=${ADMIN_DATASOURCE_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/Music_Library}}
spring.datasource.username=${ADMIN_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${ADMIN_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
jwt.secret=${JWT_SECRET}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
notification.api-key=${NOTIFICATION_API_KEY:}
notification.recipient=${NOTIFICATION_RECIPIENT:}

notification.service-url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}

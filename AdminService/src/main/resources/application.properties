spring.application.name=AdminService
server.port=8082

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/admin_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.jwt.secret=${JWT_SECRET}
app.upload-dir=${UPLOAD_DIR:uploads}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://notification-service:8085}
notification.service.api-key=${INTERNAL_API_KEY}
user.service.url=${USER_SERVICE_URL:http://user-service:8080}
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

server.port=${PORT:8085}
spring.application.name=notification-service

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.datasource.url=${NOTIFICATION_DATASOURCE_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/Music_Library}}
spring.datasource.username=${NOTIFICATION_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${NOTIFICATION_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
notification.api-key=${NOTIFICATION_API_KEY:}

spring.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
